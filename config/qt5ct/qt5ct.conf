[Appearance]

# Icon theme
icon_theme = Adwaita

# Widget style
style = Fusion

# Xero Oxocarbon palette
color_scheme_path = ~/.config/qt6ct/colors/xero.conf

# Use native dialogs
standard_dialogs = default

# Disable ugly effects
effects = none


[Fonts]

fixed = JetBrainsMono Nerd Font,10,-1,5,50,0,0,0,0,0
general = JetBrainsMono Nerd Font,10,-1,5,50,0,0,0,0,0


[Interface]

# Better spacing
double_click_interval = 400
cursor_flash_time = 1000
show_shortcuts_in_context_menus = true


[Settings]

# Enable animations
gui_effects = none
